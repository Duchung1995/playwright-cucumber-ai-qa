name: e2e

# Runs against the real public Toolshop. That site rate-limits and can show GitHub runners a
# Cloudflare bot check, so a red run is expected sometimes. The job summary labels each failure
# with a likely cause, so environment blocks are not mistaken for test or product bugs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm run lint
      - name: Run tests
        run: npm test
      - name: Failure report
        if: always()
        run: npm run -s report:failures >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload full report (HTML, JSON, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 14
